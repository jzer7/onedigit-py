name: Continuous Integration for Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  test:
    name: Test main package
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # https://github.com/go-task/setup-task/releases/tag/v2.2.0
        with:
          version: 3.x

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # https://github.com/astral-sh/setup-uv/releases/tag/v9.0.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: task setup

      - name: Static analysis on main code
        run: task check:code

      # Run static analysis on tests separately.
      # Some tools inject knowledge of the main codebase into tests, which is acceptable for CI.
      # However, IDEs may not do this, so we validate types in tests independently.
      - name: Static analysis on tests
        run: task check:tests

      - name: Run tests on codebase (pytest)
        run: task test
