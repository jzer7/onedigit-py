name: Continuous Integration for Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  test:
    name: Test main package
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # https://github.com/actions/checkout/releases/tag/v7.0.0

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # https://github.com/go-task/setup-task/releases/tag/v2.1.0
        with:
          version: 3.x

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # https://github.com/astral-sh/setup-uv/releases/tag/v8.3.1
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: task setup

      - name: Static analysis on main code
        run: task check:code

      # Run static analysis on tests separately.
      # Some tools inject knowledge of the main codebase into tests, which is acceptable for CI.
      # However, IDEs may not do this, so we validate types in tests independently.
      - name: Static analysis on tests
        run: task check:tests

      - name: Run tests on codebase (pytest)
        run: task test
